[project]
name = "spatialsurv"
version = "0.1.0"
description = "Do spatial tumor-microenvironment features add prognostic value in breast cancer IMC?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lifelines==0.30.3",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "scikit-survival==0.28.0",
    "scipy==1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatialsurv", "src/celesta_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
